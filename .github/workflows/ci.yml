name: Build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    
env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Update toolchain
      run: rustup update
    - name: Format
      run: cargo fmt --all --check
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
